kind: DaemonSet

serviceAccount:
  create: true

rbac:
  create: true

config:
  inputs: |
    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        Parser            cri
        Tag               kube.*
        Mem_Buf_Limit     5MB
        Skip_Long_Lines   On

  filters: |
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Merge_Log           On
        Keep_Log            On

  outputs: |
    [OUTPUT]
        Name              loki
        Match             kube.*
        Host              loki.logging.svc.cluster.local # find correct servicename using kubectl get svc -n (then the namespace the thing we want is in ) and get the correct port fro. here # 
        Port              3100
        Labels            job=fluent-bit

