deploymentMode: Monolithic

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  schemaConfig:
    configs:
      - from: "2026-08-28"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  storage:
    type: s3
    bucketNames:
      chunks: eks-v1-dev-loki-logs
      ruler: eks-v1-dev-loki-logs
    s3:
      region: eu-west-2

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: gp2
    size: 10Gi

read:
  replicas: 0

write:
  replicas: 0

backend:
  replicas: 0

minio:
  enabled: false

serviceAccount:
  create: true
  name: loki