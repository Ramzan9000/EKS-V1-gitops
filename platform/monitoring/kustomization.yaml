apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

configMapGenerator:
  - name: grafana-custom-dashboards
    files:
      - dashboards/blackbox.json
      - dashboards/kube-state-metrics.json
      - dashboards/node-exporter.json

generatorOptions:
  disableNameSuffixHash: true
