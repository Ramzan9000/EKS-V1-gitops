apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: storage
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Ramzan9000/EKS-V1-gitops.git
    targetRevision: main
    path: platform/storage

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
