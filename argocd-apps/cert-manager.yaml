apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: cert-manager
  namespace: argocd

spec:
  project: default

  sources:
    - repoURL: oci://quay.io/jetstack/charts/cert-manager:v1.21.1
      chart: cert-manager
      targetRevision: v1.21.1 

      helm:
        valueFiles:
          - $values/platform/cert-manager/values.yaml

    - repoURL: https://github.com/Ramzan9000/EKS-V1-gitops
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager

  syncPolicy:
    automated:
      prune: true
      selfHeal: true


    syncOptions:
      - CreateNamespace=true

