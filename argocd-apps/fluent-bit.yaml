apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: fluent-bit
  namespace: argocd

spec:
  project: default

  sources:
    - repoURL: https://fluent.github.io/helm-charts/
      chart: fluent-bit
      targetRevision: 0.58.1

      helm:
        valueFiles:
          - $values/platform/logging/fluent-bit/values.yaml

    - repoURL: https://github.com/Ramzan9000/EKS-V1-gitops
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: logging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true


    syncOptions:
      - CreateNamespace=true

