apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: blackbox-exporter
  namespace: argocd

spec:
  project: default

  sources:
    - repoURL: #link#
      chart: prometheus-blackbox-exporter
      targetRevision: #version#

      helm:
        valueFiles:
          - $values/platform/blackbox-exporter/values.yaml

    - repoURL: https://github.com/Ramzan9000/EKS-V1-gitops
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true


    syncOptions:
      - CreateNamespace=true


